<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Startup</title>

    <link href="/src/style.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-cover bg-center bg-no-repeat bg-[url('/back.png')]">

    <!-- Navbar -->
    <nav class="flex flex-col md:flex-row items-center justify-between gap-5 md:gap-0 px-5 sm:px-8 py-4">

        <!-- Logo -->
        <div class="flex items-center gap-2">
            <img src="/project-launch.png" alt="logo" class="w-8 h-8">

            <h2 class="text-white text-xl font-bold">
                Startup
            </h2>
        </div>


        <!-- Menu -->
        <div class="flex flex-wrap justify-center items-center gap-4 sm:gap-6 md:gap-8">

            <a href="#" class="text-white hover:text-blue-400 transition duration-300 text-sm">
                Home
            </a>

            <a href="#" class="text-white hover:text-blue-400 transition duration-300 text-sm">
                About
            </a>

            <a href="#" class="text-white hover:text-blue-400 transition duration-300 text-sm">
                Pricing
            </a>

            <a href="#" class="text-white hover:text-blue-400 transition duration-300 text-sm">
                Support
            </a>

            <a href="#" class="text-white hover:text-blue-400 transition duration-300 text-sm">
                Pages
            </a>

        </div>


        <!-- Right Side -->
        <div class="flex items-center gap-3 sm:gap-4">

            <a href="#" class="text-white hover:text-blue-400 transition duration-300 text-sm">
                Sign In
            </a>

            <button
                class="bg-blue-500 hover:bg-blue-600 hover:scale-105 transition duration-300 text-white px-4 sm:px-5 py-2 rounded-md">
                Sign Up
            </button>

            <img src="/settings.png" alt="settings" class="w-5 h-5">

        </div>

    </nav>


    <!-- Hero Section -->
    <div class="text-center text-white mt-24 sm:mt-32 md:mt-40 px-5">

        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold leading-tight">
            Startup Focused
            <br>
            Tailwind CSS Template
        </h1>

        <p class="mt-4 text-sm sm:text-base leading-6">
            A Complete Tailwind CSS Template Crafted for
            <br class="hidden sm:block">
            Startup, SaaS, Business, Software and Agencies.
        </p>

        <div class="mt-6 flex flex-col sm:flex-row justify-center items-center gap-3">

            <button
                class="bg-blue-500 hover:bg-blue-600 hover:scale-105 transition duration-300 text-white px-6 py-3 rounded-md w-full sm:w-auto">
                Get Started
            </button>

            <button
                class="bg-gray-700 hover:bg-gray-600 hover:scale-105 transition duration-300 text-white px-6 py-3 rounded-md w-full sm:w-auto">
                Learn More
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script type="module" src="/src/main.js"></script>

</body>

</html>
